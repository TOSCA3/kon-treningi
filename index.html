<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Treningi przed kolokwiami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<main class="wrap">
  <div class="kt-bar" id="ktBar"></div>
  <h1>Treningi przed kolokwiami</h1>
  <p class="lead">Interaktywne treningi do nauki we dwóch albo w pojedynkę: lekcje, dopasowywanie, sortowanie, przypadki kliniczne i zadania pisemne jak na kolokwium.</p>
  <div id="state"><p class="mute">Sprawdzam konto…</p></div>
  <div class="list" id="list"></div>
  <footer>Materiały pomocnicze do nauki, nie zastępują podręcznika ani zajęć.</footer>
</main>
<script src="vendor/supabase.js"></script>
<script src="auth.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id), esc = KT.esc;
  KT.renderBar($('ktBar'));
  await KT.ready;
  if (!KT.sb) { $('state').innerHTML = '<div class="box bad">Serwer kont jest chwilowo niedostępny. Spróbuj później.</div>'; return; }
  if (!KT.user) { location.replace(KT.loginUrl()); return; }
  if (KT.member.status === 'rejected') { $('state').innerHTML = '<div class="box bad"><b>Dostęp nie został przyznany.</b> Jeśli to pomyłka, napisz do Artura.</div>'; return; }
  if (!KT.approved()) { $('state').innerHTML = `<div class="box warn"><b>Twoje konto czeka na akceptację.</b><br>Gdy Artur je zaakceptuje, odśwież tę stronę i zobaczysz treningi. Zalogowano jako ${esc(KT.user.email)}.</div>`; return; }
  $('state').innerHTML = '';
  if (KT.isAdmin()) {
    const { count } = await KT.sb.from('members').select('user_id', { count: 'exact', head: true }).eq('status', 'pending');
    if (count) $('state').innerHTML = `<div class="box warn"><b>${count} ${count === 1 ? 'osoba czeka' : 'osoby czekają'} na akceptację.</b> <a class="kt-link" href="admin.html">Otwórz panel akceptacji</a></div>`;
  }
  const cat = await KT.catalog();
  if (!cat || !cat.length) { $('list').innerHTML = '<div class="box">Nie udało się wczytać listy treningów (albo jeszcze żadnego nie ma).</div>'; return; }
  $('list').innerHTML = cat.map(t => `<a class="card" href="t.html?id=${encodeURIComponent(t.id)}"><span class="bar" style="background:${esc(t.col || '#888')}"></span><div><h2>${esc(t.title)}</h2><p>${esc(t.desc || '')}</p><div class="meta">${(t.tags || []).map(x => `<span>${esc(x)}</span>`).join('')}${t.date ? `<span>${esc(t.date)}</span>` : ''}</div><div class="stats" data-stats="${esc(t.id)}"></div></div><span class="go">Otwórz →</span></a>`).join('');
  const rows = await KT.attempts();
  document.querySelectorAll('[data-stats]').forEach(el => {
    const r = rows.filter(x => x.training === el.dataset.stats); if (!r.length) { el.textContent = 'Jeszcze nie zaczęte.'; return; }
    const uniq = new Set(r.map(x => x.task_id)).size, avg = Math.round(100 * r.reduce((a, x) => a + x.score, 0) / r.length), rev = KT.toReview(r).length;
    el.textContent = `Twoje wyniki: ${uniq} różnych zadań, średnio ${avg}%, do poprawy: ${rev}`;
  });
})();
</script>
</body>
</html>
